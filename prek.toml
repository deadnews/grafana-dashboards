[update]
freeze = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "331f33fa4dfbcbca7c3da3620c137fde0faab273" # frozen: v3.9.10
hooks = [
  { id = "prettier" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "7f9d0819ca1c008ade73f4b41fa9d258d48f605b" # frozen: v1.51.1
hooks = [
  { id = "typos" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "a76b92851fc9eede9f9bc4073eb55202f34eb0df" # frozen: 0.39.0
hooks = [
  { id = "check-github-workflows" },
  { id = "check-renovate" },
]
[[repos]]
repo = "https://github.com/compwa/taplo-pre-commit"
rev = "ade0f95ddcf661c697d4670d2cfcbe95d0048a0a" # frozen: v0.9.3
hooks = [
  { id = "taplo-format" },
]
